<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City Hotel Wettingen — Verwaltung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:#F6F5F1;-webkit-font-smoothing:antialiased}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sidebar-desktop{left:0}
    .mobile-header{display:none}
    .main-content{margin-left:232px}
    @media(max-width:768px){
      html,body{height:auto!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
      #root{height:auto!important;min-height:100vh}
      .mobile-header{display:flex!important}
      .main-content{margin-left:0!important;padding-top:56px!important}
      .sidebar-desktop{left:-240px!important;transition:left 0.25s ease}
      .sidebar-desktop.mob-open{left:0!important}
      .page-padding{padding:16px!important}
      .stat-grid{grid-template-columns:repeat(2,1fr)!important}
      .table-scroll{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
      .page-header{flex-direction:column!important;gap:12px!important;margin-bottom:20px!important}
      .page-header h1{font-size:22px!important}
      .two-col,.dash-2col{grid-template-columns:1fr!important;gap:12px!important}
      .rue-card{grid-template-columns:1fr auto!important;gap:8px!important}
    }
  </style>
</head>
