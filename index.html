<html lang="de">
<head>

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    #app-error{display:none;position:fixed;inset:0;background:#FEF2F2;color:#991B1B;font-family:monospace;font-size:13px;padding:32px;z-index:9999;white-space:pre-wrap;overflow:auto}
